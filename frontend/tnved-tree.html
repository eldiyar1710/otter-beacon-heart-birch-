<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТН ВЭД AI — Дерево · Поиск · Калькулятор</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--bg2:#111827;--surface:#1a2332;--surface2:#243044;--border:#2d3a4f;--text:#e8eef7;--muted:#8b9bb4;--accent:#3b82f6;--accent2:#60a5fa;--green:#34d399;--amber:#fbbf24;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:60px 1fr;height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:60px auto 1fr}.sidebar{max-height:35vh}}
.header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--bg2);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:1.1rem}.logo span{background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-wrap{flex:1;max-width:480px;position:relative}
.search-wrap input{width:100%;padding:9px 14px 9px 38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none}
.search-wrap::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.82rem;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#2563eb,#4f46e5);border:none;color:#fff}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:10px}
.sidebar h3{font-size:.68rem;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.tree-item{padding:7px 8px;border-radius:7px;cursor:pointer;font-size:.8rem;color:var(--muted);display:flex;gap:7px}
.tree-item:hover,.tree-item.active{background:rgba(59,130,246,.12);color:var(--accent2)}
.tree-item .num{font-weight:600;color:var(--accent2);min-width:26px}
.main{overflow-y:auto;padding:20px;background:radial-gradient(ellipse at top,#152036,var(--bg) 50%)}
.hero h1{font-size:1.45rem;margin-bottom:4px}.hero p{color:var(--muted);font-size:.9rem;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 360px;gap:16px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chat{height:220px;overflow-y:auto;background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid var(--border)}
.msg{margin-bottom:10px;padding:9px 11px;border-radius:10px;font-size:.85rem;max-width:92%}
.msg.bot{background:var(--surface2)}.msg.user{background:rgba(59,130,246,.2);margin-left:auto;text-align:right}
.chat-input{display:flex;gap:7px}
.chat-input input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);outline:none}
.chip{padding:4px 9px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);font-size:.72rem;cursor:pointer;color:var(--muted);margin-right:5px}
.code-row{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:5px}
.code-row:hover{background:var(--surface2)}
.code-row .code{font-family:monospace;font-weight:600;color:var(--accent2);font-size:.9rem}
.code-row .name{font-size:.8rem;color:var(--muted)}
.code-row .meta{font-size:.72rem;color:var(--green)}
.receipt{background:linear-gradient(160deg,#1e293b,#0f172a);border:1px solid var(--border);border-radius:14px;padding:18px}
.receipt h3{text-align:center;font-size:.95rem}.receipt .sub{text-align:center;font-size:.7rem;color:var(--muted);margin-bottom:12px}
.receipt .line{border-top:1px dashed var(--border);margin:10px 0}
.receipt .row{display:flex;justify-content:space-between;padding:7px 0;font-size:.88rem}
.receipt .row.total{font-weight:700;font-size:1.1rem;color:var(--green)}
.receipt .note{margin-top:12px;font-size:.7rem;color:var(--muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
label{display:block;font-size:.68rem;color:var(--muted);margin-bottom:3px}
input,select{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.85rem}
.upload-zone{border:2px dashed var(--border);border-radius:11px;padding:22px;text-align:center;cursor:pointer;color:var(--muted);font-size:.85rem}
.upload-zone input{display:none}.badge{padding:2px 7px;border-radius:5px;font-size:.68rem;background:rgba(59,130,246,.2);color:var(--accent2)}
.status-pill{font-size:.72rem;padding:3px 9px;border-radius:16px;background:var(--surface2);color:var(--muted)}.status-pill.on{color:var(--green)}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="logo">◈ <span>ТН ВЭД AI</span></div>
<div class="search-wrap"><input id="globalSearch" placeholder="Поиск по коду или названию..." oninput="onSearch()"></div>
<span class="status-pill" id="dbStatus">демо</span>
<button class="btn" onclick="showUpload()">Excel</button>
<button class="btn btn-primary" onclick="document.getElementById('aiInput').focus()">AI</button>
</header>
<aside class="sidebar"><h3>Дерево ТН ВЭД</h3><div id="tree"></div></aside>
<main class="main">
<div class="hero"><h1>Дерево · AI · Платежи</h1>
<p>Клон логики tnved.info/TnvedTree + наш AI. Бесплатно, современный UI.</p></div>
<div class="grid">
<div>
<div class="card"><h2><span class="dot"></span> AI-классификатор</h2>
<div class="chat" id="chat"></div>
<div class="chat-input">
<input id="aiInput" placeholder="Чипсы из Китая, 500 кг, 3.5 млн ₸..." onkeydown="if(event.key==='Enter')aiSend()">
<button class="btn btn-primary" onclick="aiSend()">→</button>
</div>
<div style="margin-top:8px">
<span class="chip" onclick="aiExample('chips')">Чипсы</span>
<span class="chip" onclick="aiExample('broth')">Бульон</span>
<span class="chip" onclick="aiExample('coffee')">Кофе</span>
</div></div>
<div class="card"><h2><span class="dot" style="background:var(--green)"></span> Коды <span id="listCount" style="color:var(--muted);font-weight:400"></span></h2>
<div id="codeList"></div></div>
<div class="card" id="panel-upload" style="display:none">
<h2>Excel база</h2>
<p style="font-size:.8rem;color:var(--muted);margin-bottom:10px"><a href="https://www.tws.by/tws/tnved/download" style="color:var(--accent2)" target="_blank">tws.by</a></p>
<div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">📄 tnved.xlsx<input type="file" id="fileInput" accept=".xlsx,.xls,.csv"></div>
<div id="uploadMsg" style="margin-top:8px;font-size:.8rem"></div>
</div></div>
<div>
<div class="card"><h2><span class="dot" style="background:var(--amber)"></span> Калькулятор</h2>
<div class="form-row"><div><label>Код</label><input id="codeInput" placeholder="2005202000"></div>
<div><label>Стоимость</label><input id="valueInput" type="number" placeholder="3500000"></div></div>
<div class="form-row"><div><label>Вес кг</label><input id="weightInput" type="number" placeholder="500"></div>
<div><label>Валюта</label><select id="currencySelect"><option value="KZT">₸</option><option value="RUB">₽</option></select></div></div>
<div class="form-row"><div><label>Страна</label><select id="countrySelect"><option value="OTHER">Третья</option><option value="EAEU">ЕАЭС</option><option value="CIS">СНГ</option></select></div>
<div><label>НДС</label><select id="vatSelect"><option value="10">10%</option><option value="20">20%</option><option value="0">0%</option></select></div></div>
<button class="btn btn-primary" style="width:100%;margin-top:6px;padding:11px" onclick="calculate()">Рассчитать</button>
</div>
<div id="receiptBox"></div>
<div id="codeDetail"></div>
</div></div>
</main></div>
<script>
const SECTIONS=[{n:"I",r:"01-05",t:"Животные; продукты животные"},{n:"II",r:"06-14",t:"Растительные продукты"},{n:"III",r:"15",t:"Жиры и масла"},{n:"IV",r:"16-24",t:"Пища; напитки; табак"},{n:"V",r:"25-27",t:"Минералы"},{n:"VI",r:"28-38",t:"Химия"},{n:"VII",r:"39-40",t:"Пластмассы; каучук"},{n:"VIII",r:"41-43",t:"Кожа; меха"},{n:"IX",r:"44-46",t:"Древесина"},{n:"X",r:"47-49",t:"Бумага"},{n:"XI",r:"50-63",t:"Текстиль"},{n:"XII",r:"64-67",t:"Обувь"},{n:"XIII",r:"68-70",t:"Камень; стекло"},{n:"XIV",r:"71",t:"Драгоценности"},{n:"XV",r:"72-83",t:"Металлы"},{n:"XVI",r:"84-85",t:"Машины"},{n:"XVII",r:"86-89",t:"Транспорт"},{n:"XVIII",r:"90-92",t:"Оптика"},{n:"XIX",r:"93",t:"Оружие"},{n:"XX",r:"94-96",t:"Мебель; игрушки"},{n:"XXI",r:"97",t:"Искусство"}];
const DEMO=[{code:"2005202000",name:"Чипсы/криспы картофельные",rate:"15%",rateType:"advalorem",rateValue:15,vat:10},{code:"1905905500",name:"Экструдированные снеки",rate:"15%",rateType:"advalorem",rateValue:15,vat:10},{code:"1905100000",name:"Хрустящие хлебцы",rate:"15%",rateType:"combined",rateValue:15,specific:0.15,vat:10},{code:"2104100000",name:"Супы и бульоны",rate:"15%",rateType:"advalorem",rateValue:15,vat:10},{code:"0901210000",name:"Кофе жареный",rate:"10%",rateType:"advalorem",rateValue:10,vat:20},{code:"8470100000",name:"Калькуляторы",rate:"0%",rateType:"advalorem",rateValue:0,vat:20}];
let DB=[...DEMO];
function fee(v,c){if(c==="RUB"){if(v<=200000)return 1231;if(v<=450000)return 2462;if(v<=1200000)return 4924;return 13541}if(v<=500000)return 5000;if(v<=2000000)return 15000;if(v<=5000000)return 25950;return 45000}
function sym(){return document.getElementById("currencySelect").value==="RUB"?"₽":"₸"}
function money(n){return Math.round(n).toLocaleString("ru-RU")+" "+sym()}
function buildTree(){document.getElementById("tree").innerHTML=SECTIONS.map(s=>`<div class="tree-item" onclick="selectSection('${s.r}',this)"><span class="num">${s.n}</span><span>${s.t} (${s.r})</span></div>`).join("")}
function selectSection(range,node){document.querySelectorAll(".tree-item").forEach(t=>t.classList.remove("active"));node&&node.classList.add("active");const[a,b]=range.includes("-")?range.split("-"):[range,range];const f=a.padStart(2,"0"),t=b.padStart(2,"0");renderList(DB.filter(i=>{const c=i.code.slice(0,2);return c>=f&&c<=t}))}
function renderList(items){document.getElementById("listCount").textContent="("+items.length+")";document.getElementById("codeList").innerHTML=items.slice(0,60).map(i=>`<div class="code-row" onclick="pickCode('${i.code}')"><div class="code">${i.code}</div><div class="name">${i.name}</div><div class="meta">${i.rate} · НДС ${i.vat}%</div></div>`).join("")||'<p style="color:var(--muted);font-size:.85rem">Нет кодов. Excel или другой раздел.</p>'}
function pickCode(code){document.getElementById("codeInput").value=code;const item=DB.find(x=>x.code===code);if(item){document.getElementById("vatSelect").value=item.vat;document.getElementById("codeDetail").innerHTML=`<div class="card"><h2>Справка</h2><span class="badge">${item.code}</span><p style="margin:8px 0;font-size:.85rem">${item.name}</p><p style="font-size:.8rem;color:var(--muted)">${item.rate} · НДС ${item.vat}%</p></div>`}}
function onSearch(){const q=document.getElementById("globalSearch").value.toLowerCase().trim();renderList(!q?DB.slice(0,30):DB.filter(i=>i.code.includes(q)||(i.name||"").toLowerCase().includes(q)))}
function calculate(){const code=document.getElementById("codeInput").value.replace(/\s/g,"");const value=+document.getElementById("valueInput").value||0;const weight=+document.getElementById("weightInput").value||0;const country=document.getElementById("countrySelect").value;const vatRate=+document.getElementById("vatSelect").value||20;const cur=document.getElementById("currencySelect").value;if(!code||value<=0){alert("Код и стоимость");return}const item=DB.find(x=>x.code===code||x.code.startsWith(code));let duty=0;if(country==="EAEU")duty=0;else if(item&&item.rateType==="advalorem")duty=value*(item.rateValue/100);else if(item&&item.rateType==="combined")duty=Math.max(value*(item.rateValue/100),(item.specific||0)*weight*500);else duty=value*0.15;const f=fee(value,cur);const vat=(value+duty+f)*(vatRate/100);const total=duty+f+vat;document.getElementById("receiptBox").innerHTML=`<div class="receipt"><h3>Таможенные платежи и налоги</h3><div class="sub">код ${code}</div><div class="line"></div><div class="row"><span>Таможенный сбор</span><span>${money(f)}</span></div><div class="row"><span>Импортная пошлина</span><span>${money(duty)}</span></div><div class="row"><span>НДС</span><span>${money(vat)}</span></div><div class="row total"><span>ИТОГО*:</span><span>${money(total)}</span></div><div class="note">* Базовый расчёт. Возможны доп. тарифные меры и преференции.</div></div>`;if(item)pickCode(item.code)}
function aiMsg(r,h){const c=document.getElementById("chat");const d=document.createElement("div");d.className="msg "+r;d.innerHTML=h;c.appendChild(d);c.scrollTop=c.scrollHeight}
function aiReset(){document.getElementById("chat").innerHTML="";aiMsg("bot","Опишите товар — подберу код и посчитаю платежи.")}
function aiExample(t){const m={chips:"Картофельные чипсы из Китая, 500 кг, 3500000 тенге",broth:"Сухой бульон, Турция, 200 кг, 950000 тенге",coffee:"Кофе жареный, Бразилия, 100 кг, 800000 тенге"};document.getElementById("aiInput").value=m[t];aiSend()}
function aiSend(){const input=document.getElementById("aiInput");const text=input.value.trim();if(!text)return;input.value="";aiMsg("user",text);const t=text.toLowerCase();let keys=/чип|крисп|chips/.test(t)?["чип","ломтик","2005"]:/бульон|суп/.test(t)?["бульон","суп","2104"]:/кофе/.test(t)?["кофе","0901"]:t.split(/\s+/).filter(w=>w.length>3).slice(0,4);const scored=DB.map(item=>{let s=0;const n=(item.name||"").toLowerCase();keys.forEach(k=>{if(n.includes(k)||item.code.includes(k))s+=2});return{s,item}}).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,4);const vm=text.match(/(\d[\d\s]{2,})/);const value=vm?+String(vm[1]).replace(/\s/g,""):0;const wm=text.match(/(\d+)\s*кг/i);const weight=wm?+wm[1]:0;if(scored.length){let reply="<b>Коды:</b><br>";scored.forEach((x,i)=>{reply+=`${i+1}. <code style="color:var(--accent2)">${x.item.code}</code> ${x.item.name.slice(0,40)}<br>`});const best=scored[0].item;document.getElementById("codeInput").value=best.code;document.getElementById("vatSelect").value=best.vat;if(value)document.getElementById("valueInput").value=value;if(weight)document.getElementById("weightInput").value=weight;reply+=`<br>Выбран <b>${best.code}</b>`;if(value){aiMsg("bot",reply+" — считаю…");setTimeout(calculate,300);return}aiMsg("bot",reply+"<br>Укажите стоимость")}else aiMsg("bot","Не найдено. Загрузите Excel.")}
function handleFile(file){if(!file)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});const h=rows[0].map(x=>String(x).toLowerCase());let cc=Math.max(0,h.findIndex(x=>x.includes("код")||x.includes("code")));let nc=h.findIndex(x=>x.includes("наимен")||x.includes("name"));if(nc<0)nc=1;let rc=h.findIndex(x=>x.includes("ставк")||x.includes("пошлин"));if(rc<0)rc=2;const data=[];for(let i=1;i<rows.length;i++){let code=String(rows[i][cc]||"").replace(/[\s.]/g,"");if(!/^\d{4,10}$/.test(code))continue;code=code.padEnd(10,"0").slice(0,10);const name=String(rows[i][nc]||"").slice(0,180);let rv=15;const m=String(rows[i][rc]||"").match(/(\d+)/);if(m)rv=+m[1];data.push({code,name,rate:rv+"%",rateType:"advalorem",rateValue:rv,vat:10})}if(data.length<10)throw new Error("Мало кодов");DB=data;document.getElementById("dbStatus").textContent=data.length.toLocaleString("ru-RU");document.getElementById("dbStatus").classList.add("on");document.getElementById("uploadMsg").innerHTML="✅ "+data.length;renderList(DB.slice(0,30))}catch(err){document.getElementById("uploadMsg").innerHTML="❌ "+err.message}};r.readAsArrayBuffer(file)}
document.getElementById("dropZone").ondragover=e=>e.preventDefault();document.getElementById("dropZone").ondrop=e=>{e.preventDefault();e.dataTransfer.files[0]&&handleFile(e.dataTransfer.files[0])};document.getElementById("fileInput").onchange=()=>fileInput.files[0]&&handleFile(fileInput.files[0]);
function showUpload(){const p=document.getElementById("panel-upload");p.style.display=p.style.display==="none"?"block":"none"}
buildTree();renderList(DB);aiReset();
</script>
</body>
</html>
